<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="1000" height="100">
  <!-- Styles -->
  <style>
    .box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 6; }
    .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #212529; text-anchor: middle; dominant-baseline: middle; font-weight: 500; }
    .arrow { stroke: #adb5bd; stroke-width: 2; marker-end: url(#arrowhead); }
    .file { fill: #e7f5ff; stroke: #339af0; stroke-width: 2; rx: 4; }
    .file-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #1864ab; text-anchor: middle; dominant-baseline: middle; font-weight: bold; }
  </style>

  <!-- Arrowhead Marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#adb5bd" />
    </marker>
  </defs>

  <!-- File Save -->
  <rect x="20" y="30" width="110" height="40" class="file" />
  <text x="75" y="52" class="text" fill="#1864ab">File Save</text>

  <!-- Arrow -->
  <line x1="130" y1="50" x2="170" y2="50" class="arrow" />

  <!-- Watcher -->
  <rect x="180" y="30" width="110" height="40" class="box" />
  <text x="235" y="52" class="text">Watcher</text>

  <!-- Arrow -->
  <line x1="290" y1="50" x2="330" y2="50" class="arrow" />

  <!-- Debouncer -->
  <rect x="340" y="30" width="110" height="40" class="box" />
  <text x="395" y="52" class="text">Debouncer</text>

  <!-- Arrow -->
  <line x1="450" y1="50" x2="490" y2="50" class="arrow" />

  <!-- Diff Engine -->
  <rect x="500" y="30" width="110" height="40" class="box" />
  <text x="555" y="52" class="text">Diff Engine</text>

  <!-- Arrow -->
  <line x1="610" y1="50" x2="650" y2="50" class="arrow" />

  <!-- Context Writer -->
  <rect x="660" y="30" width="130" height="40" class="box" />
  <text x="725" y="52" class="text">Context Writer</text>

  <!-- Arrow -->
  <line x1="790" y1="50" x2="830" y2="50" class="arrow" />

  <!-- .context.md -->
  <rect x="840" y="30" width="130" height="40" class="file" />
  <text x="905" y="52" class="file-text">.context.md</text>
</svg>
