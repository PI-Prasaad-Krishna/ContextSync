name: Release ContextSync

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Run Tests
      run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            name: contextsync-linux-amd64
          - os: windows
            arch: amd64
            name: contextsync-windows-amd64.exe
          - os: darwin
            arch: amd64
            name: contextsync-darwin-amd64
          - os: darwin
            arch: arm64
            name: contextsync-darwin-arm64
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        
    - name: Build
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
      run: |
        mkdir build
        go build -o build/${{ matrix.name }} ./cmd/contextsync
        
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: build/${{ matrix.name }}
