name: Release ContextSync

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Run Tests
      run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            archive: contextsync-linux-amd64.tar.gz
            bin_name: contextsync
          - os: windows
            arch: amd64
            archive: contextsync-windows-amd64.zip
            bin_name: contextsync.exe
          - os: darwin
            arch: amd64
            archive: contextsync-darwin-amd64.tar.gz
            bin_name: contextsync
          - os: darwin
            arch: arm64
            archive: contextsync-darwin-arm64.tar.gz
            bin_name: contextsync
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        
    - name: Build and Archive
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
      run: |
        go build -o ${{ matrix.bin_name }} ./cmd/contextsync
        if [ "${{ matrix.os }}" = "windows" ]; then
          zip ${{ matrix.archive }} ${{ matrix.bin_name }}
        else
          tar -czvf ${{ matrix.archive }} ${{ matrix.bin_name }}
        fi
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.archive }}
        path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
